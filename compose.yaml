services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: arena
      POSTGRES_USER: arena
      POSTGRES_PASSWORD: ${ARENA_DB_PASSWORD:?Defina ARENA_DB_PASSWORD no .env}
    volumes:
      - arena_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arena -d arena"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      PGPASSWORD: ${ARENA_DB_PASSWORD:?Defina ARENA_DB_PASSWORD no .env}
      ARENA_ADMIN_KEY: ${ARENA_ADMIN_KEY:?Defina ARENA_ADMIN_KEY no .env}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ARENA_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    build: .
    environment:
      ARENA_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${ARENA_WEB_PORT:-3101}:3100"

volumes:
  arena_pgdata:
